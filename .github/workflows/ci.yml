name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint (ruff)
        run: uv run --extra dev ruff check ros tests scripts

      - name: Test (pytest)
        # --extra all pulls the optional providers/knowledge/vectors so the full suite imports;
        # first run downloads the local embedder model (fastembed), so this step can be slow.
        run: uv run --extra dev --extra all python -m pytest -q

      - name: OpenAPI contract is current (drift check)
        # Regenerate openapi.json and fail if it differs from the committed copy - keeps the
        # published API contract (consumed by the frontend's generated client) always current.
        run: |
          uv run --extra all python scripts/export_openapi.py
          git diff --exit-code openapi.json
